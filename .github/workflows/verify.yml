name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: dotnet test ConsultReady.sln --configuration Release
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npx --prefix web playwright test --config web/playwright.config.ts
      - run: docker build -t consultready .
